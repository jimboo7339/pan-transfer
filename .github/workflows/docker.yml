# 推送到 GitHub 自动构建多架构镜像并发布到 ghcr.io，打 tag 时额外产出多平台二进制与 Release：
#   - 推 main/master → ghcr.io/<owner>/<repo>:latest + sha-xxxxxxx
#   - 推 v* tag     → ghcr.io/<owner>/<repo>:1.2.3（语义化版本）
#                     + 跨平台二进制（linux amd64/arm64、windows、darwin）
#                     + GitHub Release（自动生成发布说明）
# 权限：GITHUB_TOKEN 默认具备写 packages 权限（下方 permissions 已声明）。
# 首次发布后到 GitHub 仓库 Packages 设置里把镜像可见性设为 public，NAS 才能匿名拉取。
#
# 发布说明为什么自动生成而不是手写：手写会过期（忘了更新），
# 而 git 提交历史本身就是最准确的变更记录。
# 脚本取「上一个 tag 到当前 tag 之间」的提交，按 conventional commit 前缀分组。

name: docker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 交叉编译目标：linux amd64/arm64 覆盖 NAS 与服务器；
  # windows/darwin 给「直接跑二进制而不是 Docker」的用户。
  RELEASE_TARGETS: "linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64"

jobs:
  # 测试先行：后端 vet + 全量单测 + 前端构建，不过不发布镜像
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: frontend build
        working-directory: web
        run: |
          npm ci
          npm run build

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 打 tag 时额外产出跨平台二进制 + GitHub Release。
  #
  # 为什么需要：自托管用户里相当一部分人不用 Docker（Windows 上直接跑，
  # 或 NAS 上看不惯容器），有个可下载的 exe 能显著降低试用门槛。
  #
  # 目录结构：每个目标平台一个 dist/pan-transfer-<version>-<os>-<arch>/ 目录，
  # 里面放二进制 + README + compose，再分别打成 tar.gz 或 zip。
  # 附带 SHA256SUMS.txt 让用户能校验下载完整性（供应链完整性的最低成本手段）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要写权限
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 生成发布说明要读历史提交

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: cross-compile
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          for target in $RELEASE_TARGETS; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            out="dist/pan-transfer-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "$out"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            echo "==> building $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$out/pan-transfer${ext}" ./cmd/server
            # 每个包附一份 README 与 compose，用户拿到就能跑
            cp README.md "$out/" 2>/dev/null || true
            cp docker-compose.yml "$out/" 2>/dev/null || true
          done

      - name: package archives
        run: |
          set -euo pipefail
          cd dist
          for d in pan-transfer-*; do
            [ -d "$d" ] || continue
            case "$d" in
              *windows*) (cd "$d" && zip -qr "../${d}.zip" .) ;;
              *)         tar -czf "${d}.tar.gz" "$d" ;;
            esac
          done
          # 校验和：用户下载后可自行核对（供应链完整性的最低成本手段）。
          # 写到仓库根目录而不是 dist/：后面生成 Release Notes 时从根目录读，
          # 路径最短、最不容易出错。
          sha256sum pan-transfer-*.tar.gz pan-transfer-*.zip > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"
          cd "${GITHUB_WORKSPACE}"
          echo '--- dist/ ---'
          ls -la dist/ | head -20
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: generate release notes
        id: notes
        run: |
          set -uo pipefail
          # 注意：不要用 set -e，否则 git describe 在"找不到上一个 tag"时
          # 会让整个 step 失败（首次发版必然走到这条路径）。
          #
          # 另一个关键点：GitHub 会把 step 的工作目录设为 GITHUB_WORKSPACE，
          # 而 softprops/action-gh-release 读 body_path 时用的是**仓库根目录**。
          # 如果这里 cd 到 dist 再写文件，body_path 就找不到了，
          # 结果是 Release 正文为空（而不是报错）——所以这里全程用绝对路径。
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="${GITHUB_WORKSPACE}/RELEASE_NOTES.md"

          # 上一个 tag：不用 git describe（它在 tag push 场景的 HEAD^ 上
          # 经常找不到 tag，尤其在浅克隆/单 tag checkout 下），
          # 而是显式列出所有 tag 并取版本序在前一个。这样行为可预测。
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --list --sort=version:refname | awk -v v="$VERSION" '
            $0 == v { if (prev != "") print prev; exit }
            { prev = $0 }
          ')

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$VERSION" ]; then
            RANGE="${PREV_TAG}..${VERSION}"
            RANGE_LABEL="${PREV_TAG}..${VERSION}"
          else
            # 首次发版（没有更早的 tag）：列出全部提交
            RANGE="$VERSION"
            RANGE_LABEL="全部提交"
          fi
          echo "PREV_TAG=$PREV_TAG  RANGE=$RANGE"

          {
            echo "## 变更"
            echo
            echo "> 范围：\`${RANGE_LABEL}\`"
            echo
            NOTES=$(git log --pretty=format:'%s' "$RANGE" 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              # 把 conventional commit 前缀转成可读格式；
              # 没有前缀的提交原样输出（不是所有提交都遵循该规范）。
              echo "$NOTES" \
                | sed -E 's/^([a-zA-Z]+)(\([^)]*\))?:[[:space:]]*/- [\1] /' \
                | sed -E 's/^- \[([a-zA-Z]+)\] (.*)$/- **\1**：\2/'
            else
              echo "- （本次发布没有可列出的提交）"
            fi
            echo
            echo "## 升级说明"
            echo
            echo '```bash'
            echo '# Docker（推荐）'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
            echo
            echo '也支持直接下载下方的二进制包：解压后执行'
            echo '`./pan-transfer -addr :8935 -data ./data`，浏览器打开 http://127.0.0.1:8935'
            echo
            echo '> 凭据与任务都在 `data/` 卷（或 `./data` 目录）里，升级镜像不丢数据。'
            echo '> **备份时请连 `master.key` 一起保存**：没有主密钥，备份里的凭据无法解密。'
            echo
            echo '## 校验和'
            echo
            echo '```'
            if [ -f "${GITHUB_WORKSPACE}/SHA256SUMS.txt" ]; then
              cat "${GITHUB_WORKSPACE}/SHA256SUMS.txt"
            else
              echo '(无)'
            fi
            echo '```'
          } > "$NOTES_FILE"

          echo "--- wrote $NOTES_FILE ($(( $(wc -c < "$NOTES_FILE") )) bytes) ---"
          cat "$NOTES_FILE"

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}